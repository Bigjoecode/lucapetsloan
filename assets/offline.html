<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b4f3c">
<title>You're offline</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b4f3c; color: #fff; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; padding: 1.5rem; box-sizing: border-box; }
  .box { max-width: 340px; }
  .mark { width: 72px; height: 72px; display: block; margin: 0 auto 1.2rem; box-shadow: 0 10px 30px rgba(0, 0, 0, .25); border-radius: 17px; }
  h1 { font-size: 1.4rem; margin: 0 0 .5rem; }
  p { opacity: .85; line-height: 1.5; margin: 0 0 1.4rem; }
  button { background: #e0b45a; color: #0b4f3c; border: 0; border-radius: 999px; padding: .8rem 1.6rem; font-weight: 700; font-size: 1rem; cursor: pointer; }
</style>
</head>
<body>
  <div class="box">
    <svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="og" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbd77e"/><stop offset="1" stop-color="#e9a923"/></linearGradient></defs><rect width="64" height="64" rx="15" fill="#0e7a55"/><path d="M17 13 V47 H33" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M27 51 V18" fill="none" stroke="#6ee7b7" stroke-width="7" stroke-linecap="round"/><circle cx="37" cy="26" r="11" fill="url(#og)"/><circle cx="37" cy="26" r="4.2" fill="#0b4f3c"/></svg>
    <h1>You're offline</h1>
    <p>Your savings and loan are safe. Connect to the internet to see your latest balance and make payments.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
