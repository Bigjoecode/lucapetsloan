<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b4f3c">
<title>You're offline</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b4f3c; color: #fff; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; padding: 1.5rem; box-sizing: border-box; }
  .box { max-width: 340px; }
  .mark { width: 64px; height: 64px; border-radius: 18px; background: #e0b45a; color: #0b4f3c; font-size: 2rem; font-weight: 800; display: grid; place-items: center; margin: 0 auto 1.2rem; }
  h1 { font-size: 1.4rem; margin: 0 0 .5rem; }
  p { opacity: .85; line-height: 1.5; margin: 0 0 1.4rem; }
  button { background: #e0b45a; color: #0b4f3c; border: 0; border-radius: 999px; padding: .8rem 1.6rem; font-weight: 700; font-size: 1rem; cursor: pointer; }
</style>
</head>
<body>
  <div class="box">
    <div class="mark">₦</div>
    <h1>You're offline</h1>
    <p>Your savings and loan are safe. Connect to the internet to see your latest balance and make payments.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
